name: Déploiement du dashboard Pépite (GitHub Pages)

# Build le front Vite/React (frontend/) et le déploie sur GitHub Pages.
# Données DÉMO uniquement : `chasseur export-web` génère un JSON depuis les
# fixtures hors-ligne (jamais de données scrapées réelles en public — RGPD / CGU).
# Le front retombe sur sa démo embarquée si le JSON est absent.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'fixtures/**'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    - cron: '17 6 * * *'   # rafraîchit la démo chaque jour à 06h17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer le moteur (coeur hors-ligne)
        run: pip install -e .

      - name: Générer les données DÉMO (JSON pour le front Vite)
        env:
          CHASSEUR_REQUIRE_BALCONY: 'false'
          CHASSEUR_MIN_FLOOR: '0'
          CHASSEUR_BUDGET_MAX: '360000'
          CHASSEUR_EXCLUDE_UNKNOWN_FLOOR: 'false'
        run: chasseur export-web --demo --json frontend/public/data.live.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances front
        working-directory: frontend
        run: npm ci

      - name: Build du front (base = /house-opportunity-searcher/)
        working-directory: frontend
        env:
          VITE_BASE: /house-opportunity-searcher/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
