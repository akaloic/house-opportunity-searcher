[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chasseur-immo"
version = "0.1.0"
description = "Robot-chasseur immobilier Île-de-France : scraping furtif, scoring 'œil de l'expert', alerting coup de poing."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Acquisition furtive — installer quand on branche les vrais portails.
scrape = ["curl_cffi>=0.7", "selectolax>=0.3", "httpx>=0.27"]
# Enrichissement géospatial avancé (PostGIS côté serveur, shapely côté client).
geo = ["shapely>=2.0", "psycopg[binary]>=3.1"]
# Tableau de bord de commandement.
dashboard = ["streamlit>=1.36", "pandas>=2.2"]
# Canaux d'alerte (Telegram via HTTP, SMTP est en stdlib).
alert = ["requests>=2.32"]
# Cache/queue/rate-limit distribué.
infra = ["redis>=5.0"]
# Outillage dev (playwright = tests e2e navigateur du dashboard, cf tests/test_dashboard_e2e.py).
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "playwright>=1.40"]

[project.scripts]
chasseur = "chasseur.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chasseur"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
