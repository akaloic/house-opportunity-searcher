<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:22px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
</style></head><body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const DS = window.PPiteDesignSystem_0c887c || {};
    const { Card, Panel, Tabs, Badge, ScoreGauge } = DS;
    function Demo(){
      return (
        <div>
          <Tabs defaultValue="gems" tabs={[
            {id:'all', label:'Toutes', count:248},
            {id:'gems', label:'Pépites', count:14},
            {id:'saved', label:'Favoris', count:6},
            {id:'off', label:'Écartées', count:31},
          ]}/>
          <div className="grid">
            <Panel title="Carte des opportunités" subtitle="Paris · Île-de-France" actions={<Badge tone="brand">live</Badge>}>
              <div style={{height:96,borderRadius:8,background:'var(--heat-gradient)',opacity:.55,border:'1px solid var(--border-subtle)'}}/>
            </Panel>
            <Card interactive glow>
              <div style={{display:'flex',gap:14,alignItems:'center'}}>
                <ScoreGauge value={91} size={64}/>
                <div>
                  <div style={{fontWeight:600,color:'var(--text-strong)',fontSize:15}}>T3 · 62 m² · Montreuil</div>
                  <div style={{color:'var(--text-muted)',fontSize:13,margin:'4px 0 8px'}}>378 000 € · 6 097 €/m²</div>
                  <div style={{display:'flex',gap:6}}><Badge tone="gold" dot>Pépite</Badge><Badge tone="success">DPE C</Badge></div>
                </div>
              </div>
            </Card>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body></html>
