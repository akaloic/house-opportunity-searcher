<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);display:flex;align-items:flex-end;gap:14px;padding:24px 28px;height:150px;box-sizing:border-box}
  .c{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{background:var(--brand-soft);border:1px solid rgba(45,212,167,.35);border-radius:4px}
  .n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
  <div class="c"><div class="box" style="width:4px;height:4px"></div><span class="n">1·2</span></div>
  <div class="c"><div class="box" style="width:8px;height:8px"></div><span class="n">4·8</span></div>
  <div class="c"><div class="box" style="width:12px;height:12px"></div><span class="n">5·12</span></div>
  <div class="c"><div class="box" style="width:16px;height:16px"></div><span class="n">6·16</span></div>
  <div class="c"><div class="box" style="width:24px;height:24px"></div><span class="n">8·24</span></div>
  <div class="c"><div class="box" style="width:32px;height:32px"></div><span class="n">9·32</span></div>
  <div class="c"><div class="box" style="width:48px;height:48px"></div><span class="n">11·48</span></div>
  <div class="c"><div class="box" style="width:64px;height:64px"></div><span class="n">12·64</span></div>
</body></html>
