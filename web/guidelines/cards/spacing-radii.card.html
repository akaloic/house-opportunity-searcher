<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="Corner radius scale" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);display:flex;align-items:center;gap:16px;padding:24px 28px;height:150px;box-sizing:border-box}
  .c{display:flex;flex-direction:column;align-items:center;gap:9px}
  .box{width:62px;height:62px;background:var(--surface-2);border:1px solid var(--border-strong)}
  .n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
  <div class="c"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="n">xs · 4</span></div>
  <div class="c"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="n">sm · 6</span></div>
  <div class="c"><div class="box" style="border-radius:var(--radius-md)"></div><span class="n">md · 8</span></div>
  <div class="c"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="n">lg · 12</span></div>
  <div class="c"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="n">xl · 16</span></div>
  <div class="c"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="n">2xl · 20</span></div>
  <div class="c"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="n">pill</span></div>
</body></html>
