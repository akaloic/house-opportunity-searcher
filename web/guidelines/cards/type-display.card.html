<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);display:flex;align-items:center;gap:28px;padding:20px 28px;height:150px;box-sizing:border-box}
  .big{font-family:var(--font-display);font-weight:700;color:var(--text-strong);font-size:64px;line-height:1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
  .meta{display:flex;flex-direction:column;gap:8px}
  .meta div{font-family:var(--font-display);color:var(--text-default)}
  .lab{font-family:var(--font-mono)!important;font-size:10px;color:var(--text-faint)}
</style></head><body>
  <div class="big">9 240<span style="font-size:22px;color:var(--text-faint);font-family:var(--font-mono)"> €/m²</span></div>
  <div class="meta">
    <div style="font-size:28px;font-weight:600;letter-spacing:-0.01em">14 pépites détectées</div>
    <div style="font-size:18px;font-weight:500;color:var(--text-muted)">Île-de-France · 24 h</div>
    <div class="lab">Space Grotesk · 700 / 600 · tnum</div>
  </div>
</body></html>
