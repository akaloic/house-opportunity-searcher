<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success · warning · danger · info" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);display:flex;gap:10px;padding:20px;height:150px;box-sizing:border-box;align-items:stretch}
  .sw{flex:1;border-radius:10px;padding:11px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border-subtle)}
  .chip{align-self:flex-start;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .n{font-size:11px;font-weight:600;color:var(--text-default)}
  .h{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}
</style></head><body>
  <div class="sw"><span class="chip" style="background:var(--success-soft);color:var(--success-500)">Frais</span><div><div class="n">success</div><div class="h">#3FCF6A</div></div></div>
  <div class="sw"><span class="chip" style="background:var(--warning-soft);color:var(--warning-500)">Surveiller</span><div><div class="n">warning</div><div class="h">#F5A623</div></div></div>
  <div class="sw"><span class="chip" style="background:var(--danger-soft);color:var(--danger-500)">Surcoté</span><div><div class="n">danger</div><div class="h">#F2585B</div></div></div>
  <div class="sw"><span class="chip" style="background:var(--info-soft);color:var(--info-500)">Source</span><div><div class="n">info</div><div class="h">#4BA3F5</div></div></div>
</body></html>
