<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);display:flex;gap:10px;padding:20px;height:150px;box-sizing:border-box;align-items:stretch}
  .sw{flex:1;border-radius:10px;border:1px solid var(--border-subtle);padding:11px;display:flex;flex-direction:column;justify-content:space-between}
  .n{font-size:11px;font-weight:600;color:#04130E}
  .h{font-family:var(--font-mono);font-size:10px;color:rgba(4,19,14,.6)}
  .dk .n{color:var(--text-strong)} .dk .h{color:var(--text-faint)}
</style></head><body>
  <div class="sw" style="background:var(--brand-300)"><span class="n">brand-300</span><span class="h">#7CEBD0</span></div>
  <div class="sw" style="background:var(--brand-400)"><span class="n">brand-400</span><span class="h">#4FE0BA</span></div>
  <div class="sw" style="background:var(--brand-500)"><span class="n">brand-500 ●</span><span class="h">#2DD4A7</span></div>
  <div class="sw" style="background:var(--brand-600)"><span class="n">brand-600</span><span class="h">#1FB68E</span></div>
  <div class="sw" style="background:var(--gold-400)"><span class="n">gold-400</span><span class="h">#FFC658</span></div>
  <div class="sw" style="background:var(--gold-500)"><span class="n">gold-500 ◆</span><span class="h">#F2B33D</span></div>
</body></html>
