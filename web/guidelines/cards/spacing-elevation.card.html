<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation & glow" subtitle="Shadow ramp + accent glows" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);display:flex;align-items:center;gap:20px;padding:24px 30px;height:150px;box-sizing:border-box}
  .c{display:flex;flex-direction:column;align-items:center;gap:11px}
  .box{width:74px;height:54px;background:var(--surface-2);border:1px solid var(--border-subtle);border-radius:var(--radius-md)}
  .n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
  <div class="c"><div class="box" style="box-shadow:var(--shadow-1)"></div><span class="n">shadow-1</span></div>
  <div class="c"><div class="box" style="box-shadow:var(--shadow-2)"></div><span class="n">shadow-2</span></div>
  <div class="c"><div class="box" style="box-shadow:var(--shadow-3)"></div><span class="n">shadow-3</span></div>
  <div class="c"><div class="box" style="box-shadow:var(--glow-brand)"></div><span class="n">glow-brand</span></div>
  <div class="c"><div class="box" style="box-shadow:var(--glow-gold)"></div><span class="n">glow-gold</span></div>
</body></html>
