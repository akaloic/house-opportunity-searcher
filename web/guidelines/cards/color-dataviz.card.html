<!-- @dsCard group="Colors" viewport="700x150" name="Data-viz categorical" subtitle="8-hue series for charts & radar" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);display:flex;gap:8px;padding:20px;height:150px;box-sizing:border-box;align-items:stretch}
  .sw{flex:1;border-radius:9px;border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:9px;position:relative;overflow:hidden}
  .bar{position:absolute;left:0;right:0;top:0;height:46px}
  .n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);position:relative}
</style></head><body>
  <div class="sw"><div class="bar" style="background:var(--viz-1)"></div><span class="n">viz-1</span></div>
  <div class="sw"><div class="bar" style="background:var(--viz-2)"></div><span class="n">viz-2</span></div>
  <div class="sw"><div class="bar" style="background:var(--viz-3)"></div><span class="n">viz-3</span></div>
  <div class="sw"><div class="bar" style="background:var(--viz-4)"></div><span class="n">viz-4</span></div>
  <div class="sw"><div class="bar" style="background:var(--viz-5)"></div><span class="n">viz-5</span></div>
  <div class="sw"><div class="bar" style="background:var(--viz-6)"></div><span class="n">viz-6</span></div>
  <div class="sw"><div class="bar" style="background:var(--viz-7)"></div><span class="n">viz-7</span></div>
  <div class="sw"><div class="bar" style="background:var(--viz-8)"></div><span class="n">viz-8</span></div>
</body></html>
