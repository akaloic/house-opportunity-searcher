<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);display:flex;gap:10px;padding:20px;height:150px;box-sizing:border-box;align-items:stretch}
  .sw{flex:1;border-radius:10px;border:1px solid var(--border-default);padding:11px;display:flex;flex-direction:column;justify-content:space-between}
  .n{font-size:11px;font-weight:600;color:var(--text-default)}
  .h{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}
</style></head><body>
  <div class="sw" style="background:var(--bg-sunken)"><span class="n">bg-sunken</span><span class="h">#06080C</span></div>
  <div class="sw" style="background:var(--bg-base)"><span class="n">bg-base</span><span class="h">#0A0D13</span></div>
  <div class="sw" style="background:var(--surface-1)"><span class="n">surface-1</span><span class="h">#11151D</span></div>
  <div class="sw" style="background:var(--surface-2)"><span class="n">surface-2</span><span class="h">#171C26</span></div>
  <div class="sw" style="background:var(--surface-3)"><span class="n">surface-3</span><span class="h">#1E2530</span></div>
  <div class="sw" style="background:var(--surface-4)"><span class="n">surface-4</span><span class="h">#28303C</span></div>
</body></html>
