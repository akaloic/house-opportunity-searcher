<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);display:flex;align-items:center;gap:32px;padding:24px 28px;height:150px;box-sizing:border-box}
  .tile{width:72px;height:72px;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
  .lock{display:flex;align-items:center;gap:14px}
  .wm{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-0.01em;color:var(--text-strong)}
  .sub{font-size:11px;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;font-weight:600}
  .onlight{background:#EEF1F6}
</style></head><body>
  <img src="../../assets/logo-mark.svg" width="72" height="72" alt="">
  <div class="lock">
    <img src="../../assets/logo-mark.svg" width="44" height="44" alt="">
    <div><div class="wm">Pépite</div><div class="sub">Veille immobilière</div></div>
  </div>
  <div class="tile onlight"><img src="../../assets/logo-mark.svg" width="52" height="52" alt=""></div>
</body></html>
