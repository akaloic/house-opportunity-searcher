<!-- @dsCard group="Pépite Dashboard" viewport="1440x900" name="Veille immobilière — app" subtitle="Dashboard · Fiche détail · Moteur de scoring · Monitoring" -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pépite · Veille immobilière IDF</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    html, body { height: 100%; margin: 0; background: var(--bg-base); }
    #app { height: 100vh; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script src="../../_ds_bundle.js"></script>
  <!-- Données RÉELLES générées par `chasseur export-web` (fallback: data.js mock). -->
  <script src="data.live.js"></script>

  <!-- Favoris persistants (localStorage), partagés flux <-> fiche -->
  <script>
    window.PepiteFav = (function () {
      var KEY = 'pepite_favs';
      function load() { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { return new Set(); } }
      var s = load();
      return {
        has: function (id) { return s.has(id); },
        list: function () { return Array.from(s); },
        toggle: function (id) {
          if (s.has(id)) s.delete(id); else s.add(id);
          try { localStorage.setItem(KEY, JSON.stringify(this.list())); } catch (e) {}
          window.dispatchEvent(new Event('pepite-fav'));
          return s.has(id);
        }
      };
    })();
  </script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="AppShell.jsx"></script>
  <script type="text/babel" src="DashboardView.jsx"></script>
  <script type="text/babel" src="DetailView.jsx"></script>
  <script type="text/babel" src="ConfigView.jsx"></script>
  <script type="text/babel" src="MonitoringView.jsx"></script>

  <script type="text/babel" data-presets="react">
    function App() {
      const [view, setView] = React.useState('dashboard');
      const [selected, setSelected] = React.useState(window.PEPITE_DATA.LISTINGS[0]);
      const open = (l) => { setSelected(l); setView('detail'); };

      let content = null;
      if (view === 'dashboard') content = <window.DashboardView onOpen={open} />;
      else if (view === 'detail') content = <window.DetailView listing={selected} onBack={() => setView('dashboard')} />;
      else if (view === 'config') content = <window.ConfigView />;
      else if (view === 'monitoring') content = <window.MonitoringView />;

      return (
        <window.AppShell view={view} setView={setView} onRefresh={() => window.location.reload()}>
          <div key={view + (selected && selected.id)}>{content}</div>
        </window.AppShell>
      );
    }

    function mount() {
      if (!window.AppShell || !window.DashboardView || !window.DetailView || !window.ConfigView || !window.MonitoringView) {
        return requestAnimationFrame(mount);
      }
      ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    }
    mount();
  </script>
</body>
</html>
